name: Sync External Skills

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force overwrite existing skills'
        required: false
        type: boolean
        default: false
      source:
        description: 'Specific source to sync (leave empty for all)'
        required: false
        type: string
      skill:
        description: 'Specific skill to sync (leave empty for all)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync External Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          cd package
          npm ci --ignore-scripts

      - name: List external skills
        run: |
          cd package
          node bin/cli.js list-external

      - name: Sync external skills
        run: |
          cd package
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          if [ -n "${{ inputs.skill }}" ]; then
            ARGS="$ARGS --skill ${{ inputs.skill }}"
          fi
          node bin/cli.js sync-external $ARGS

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain .agents/skills)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: create_pull_request
        if: steps.check_changes.outputs.has_changes == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SYNC_EXTERNAL_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync external skills from upstream'
          title: '🔄 Sync External Skills'
          body: |
            ## External Skills Sync

            This PR was automatically created by the sync-external workflow and will be merged automatically when repository permissions allow it.

            **Changes:**
            - Updated skills from external repositories
            - Synced from configured sources in `.agents/external-skills.json`

            **Sources:**
            ${{ inputs.source || 'All configured sources' }}

            **Skills:**
            ${{ inputs.skill || 'All configured skills' }}

            ---
            🤖 Generated by [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          branch: sync-external-skills
          delete-branch: true
          labels: |
            automated
            external-skills
            dependencies

      - name: Auto-merge external skills pull request
        if: steps.check_changes.outputs.has_changes == 'true' && steps.create_pull_request.outcome == 'success' && steps.create_pull_request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SYNC_EXTERNAL_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pull_request.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --merge --delete-branch

      - name: Warn if pull request creation failed
        if: steps.check_changes.outputs.has_changes == 'true' && steps.create_pull_request.outcome == 'failure'
        run: |
          echo "::warning::External skills changed, but GitHub Actions could not create a pull request. Enable Actions pull request creation in repository settings or configure SYNC_EXTERNAL_TOKEN."
